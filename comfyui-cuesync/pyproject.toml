[project]
name = "comfyui-cuesync"
description = "CueSync for ComfyUI: a performed or in-clip sound sets when and how big fire, smoke or steam gets; LTX-2.5 with the ainvfx-fluid IC-LoRA renders it into the scene, and the render is re-timed onto the cue."
version = "0.1.0"
license = { file = "LICENSE" }
dependencies = [
  "transformers>=4.56",
  "cuesync @ git+https://github.com/grzenio22/cue-the-boom@8bd08167c8d2a760af03b9b07538a3222685a0de#subdirectory=cuesync",
]

[project.urls]
Repository = "https://github.com/grzenio22/cue-the-boom"

[tool.comfy]
PublisherId = "grzenio22"
DisplayName = "CueSync: sound-cued VFX for LTX-2.5"
