[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuesync"
version = "0.1.0"
description = "Voice-shaped VFX for LTX-2.5: turn a performed noise into a timed, sized fluid element composited onto real footage."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Grzegorz Szmulik" }]
dependencies = [
  "numpy>=2",
  "av>=17",
  "Pillow>=10",
]

[project.optional-dependencies]
comfy = ["comfy-sdk>=0.5,<0.6"]
dev = ["pytest>=8"]

[project.scripts]
cuesync = "cuesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
