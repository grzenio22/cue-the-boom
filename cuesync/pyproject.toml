[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuesync"
version = "0.1.0"
description = "Sound-cued VFX for LTX-2.5 + ainvfx-fluid: a performed or in-clip sound sets when and how big fire, smoke or steam gets; it is rendered into the scene and re-timed onto the cue."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Grzegorz Szmulik" }]
dependencies = [
  "numpy>=2",
  "av>=17",
  "Pillow>=10",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
comfy = ["comfy-sdk>=0.5,<0.6"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cuesync = "cuesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuesync = ["effect_files/*.json", "studio_static/*", "studio_static/**/*", "assets/stone/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
